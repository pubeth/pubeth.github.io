<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!--
        原先这里有一段基于 devicePixelRatio 的 rem/dpr 自适应脚本(flexible.js)。
        它会把 body 的 font-size 设成 12 * dpr（iPhone 上 dpr 常为 2 或 3，
        body 字号就变成 24px~36px），而页面里几乎所有文字用的都是百分比
        font-size(160%/150%/120%/110%)，全部在这个偏大的基准上再放大，
        导致在真机上文字巨大、换行错乱。
        另外这个脚本还会往 <head> 里插入自己的 viewport meta，但本页始终是
        被 template.html 用 <iframe> 嵌入展示的——移动端浏览器不会读取
        iframe 内部文档自己的 viewport meta，所以这段脚本唯一真正生效的
        部分就是那个把字号搞乱的 body.style.fontSize，有害无益，故整体移除，
        改为固定、可预测的字号基准。
    -->
    <title>&lrm;</title>
</head>
<style>
    @charset "utf-8";

    html {
        color: #333;
        background: #fff;
        overflow-y: scroll;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        font-size: 16px;
    }

    body {
        /* 根据屏幕实际宽度(vw)在 12px~16px 之间平滑缩放，
           比固定 14px 更贴合不同尺寸手机，
           且不依赖 devicePixelRatio，不会在高分屏上被放大出错。 */
        font-size: clamp(12px, 3.6vw, 16px);
    }

    html * {
        outline: 0;
        -webkit-text-size-adjust: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0)
    }

    html,
    body {
        font-family: sans-serif
    }

    body,
    div,

    hr,
    button,
    article,

        font-weight: 500
    }

    ol,
    ul {
        list-style: none
    }

    caption,
    th {
        text-align: left
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-size: 120%;
        font-weight: 500
    }

    q:before,

    }

    sub,

        line-height: 0;

        vertical-align: baseline

    }

    }

    a:hover {

    }

    ins,
    a {

    }

    .container {
        background: #fff;
    }

    .top {
        border-width: 0px;
        overflow: hidden;
        width: 100%;
        background: linear-gradient(116.457856204838deg, #ffffff 0%, #ffffff 100%);
    }

    .top-first {

        border-bottom: 1px solid #e4e7ed;
        margin: 1em;
        margin-top: 20px;
    }

    .top-first .p-first {

        margin-bottom: .5em;
    }

    .top-first .p-second {

    }

    .top-second {

        font-size: 120%;
    }

    .top-second ul li {
        display: inline-block;
        width: 100%;
        margin-bottom: .5em;
    }

    .first {
        line-height: 400%;
        background: inherit;
        background-color: rgba(249, 249, 247, 1);
        box-sizing: border-box;
        border-width: 1px;
        border-style: solid;
        border-color: rgba(215, 215, 215, 1);
        border-left: 0px;
        border-top: 0px;
        border-right: 0px;

        border-bottom-right-radius: 0px;
        border-bottom-left-radius: 0px;

        -webkit-box-shadow: none;
        box-shadow: none;
    }

    .first .xd {
        margin: 1em;
        font-family: 'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;
        font-weight: bold;
        font-style: normal;
        font-size: 150%;
        color: #02A7F0;
        text-align: right;
        margin-right: 10px;
        text-shadow: 2px 0 0 #02A7F0;
    }

    .first span:nth-child(2) {
        font-size: 120%;
    }

    .ycxx-line {
        border-bottom: 1px solid grey;
        padding-bottom: 0.2rem;
    }

    /* ==== 只改了下面 .ycxx 这一块：一列 + 全显示 ==== */
    .ycxx {

    }

    .ycxx-content {

    }

        word-break: break-all;
        overflow-wrap: break-word;
        white-space: normal;
    }
    /* ==== 改动到此结束，下面照抄原版 ==== */

    .ycxx-right span:nth-child(1) {
        color: #AAAAAA;
    }

    .yccs-left {

    }

    .yccs-right {

    }

    .bottom {
        margin-bottom: 0.5em;
        position: relative;
        margin-right: 0.7rem;
        float: right;
        line-height: 0.6rem;
        font-size: 120%;
        text-align: right;
    }

    textarea {
        margin: 0.2rem;
        width: 100%;
        height: fit-content;
        border: 1px solid #f2f2f2;
    }

    html,
    body,
    img {
        padding: 0;
        margin: 0;
        vertical-align: bottom;
        display: block
    }
</style>

<body>

<script>
    // 把本页真实内容高度告诉父页面(template.html)，让父页面把 iframe
    // 调整到刚好放下内容的高度，避免在手机上被固定的 76% 高度裁切、
    // 出现内部再滚动一层导致的"格式紊乱"观感。
    function postHeightToParent(){
        var h = document.body.scrollHeight;
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'machineHeight', height: h }, '*');
        }
    }
    window.addEventListener('load', postHeightToParent);
    window.addEventListener('resize', postHeightToParent);
    // 图片等异步内容加载完成后高度可能变化，稍晚再上报一次兜底
    setTimeout(postHeightToParent, 500);

    function tohref(){
        var url='http://www.guangzhouzhenyi.cn/mct/jingdianfenghuang46/';
        if(url==null||url==""||url=="null"||url=="undefined"){
            alert("暂无详情");
        }
        if(url.includes("http")){
            window.location.href=url;
        }else {
            window.location.href="https://"+url;
        }
    }
</script>
