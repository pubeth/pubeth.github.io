<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏游艺设备信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            overflow-x: hidden;   /* 关键：禁止横向滚动 */
        }
        .container {
            width: 100%;
            background: #fff;
            padding-bottom: 10px;
        }

        /* 顶部标题 */
        .top-first {
            text-align: center;
            border-bottom: 1px solid #e4e7ed;
            margin: 10px 15px 15px;
        }
        .top-first .p-first {
            font-size: 16px;
            font-weight: bold;
            padding-bottom: 10px;
        }

        /* 游戏游艺设备信息 标题行 */
        .first {
            display: flex;
            align-items: center;
            background: #f9f9f7;
            border-bottom: 1px solid #d7d7d7;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #02A7F0;
        }
        .first .xd { margin-right: 6px; }

        /* 信息列表 */
        .ycxx {
            padding: 10px 15px;
            font-size: 14px;
        }
        .ycxx-content {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
        }
        .ycxx-left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;        /* 关键：允许内容收缩，不撑破 */
        }
        .ycxx-left span:nth-child(1) {
            color: #AAAAAA;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .ycxx-left span:nth-child(2) {
            color: #000;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-all;   /* 关键：长文本自动换行 */
            overflow-wrap: break-word;
        }
        .ycxx a {
            color: #02A7F0;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <div class="top-first">
            <p class="p-first">中华人民共和国文化和旅游部</p>
        </div>
    </div>

    <div class="first">
        <span class="xd">|</span><span>游戏游艺设备信息</span>
    </div>
    <div class="ycxx">
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span>设备名称</span>
                <span>海盗船长</span>
            </div>
            <div class="ycxx-left">
                <span>型号</span>
                <span>HZS-HDCZ-1</span>
            </div>
        </div>
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span>机型机种</span>
                <span>游艺娱乐设备</span>
            </div>
            <div class="ycxx-left">
                <span>设备来源</span>
                <span>中国</span>
            </div>
        </div>
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span>批准单位</span>
                <span>江西省文化和旅游厅</span>
            </div>
            <div class="ycxx-left">
                <span>批准文号</span>
                <span>赣游艺审〔2025〕62号</span>
            </div>
        </div>
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span>批准时间</span>
                <span>20250327</span>
            </div>
            <div class="ycxx-left">
                <span>企业名称</span>
                <span>江西华之世科技有限公司</span>
            </div>
        </div>
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span>统一社会信用代码</span>
                <span>91360106MACUD1EGX5</span>
            </div>
            <div class="ycxx-left">
                <span>住所</span>
                <span>江西省南昌市高新区高新七路999号万科四季花城紫罗兰苑1栋(9#)壹层D14室(第1层)</span>
            </div>
        </div>
        <div class="ycxx-content">
            <div class="ycxx-left">
                <span> </span>
                <span><a onclick="tohref()">详情</a></span>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    function tohref(){
        var url='http://www.guangzhouzhenyi.cn/mct/jingdianfenghuang46/';
        if(url==null||url==""||url=="null"||url=="undefined"){
            alert("暂无详情");
            return;   // 加上 return，避免继续往下走
        }
        if(url.includes("http")){
            window.location.href=url;
        }else {
            window.location.href="https://"+url;
        }
    }
</script>
</html>
