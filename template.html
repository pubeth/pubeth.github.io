<html>
<head>
    <title>畅凯动漫游艺设备电子标识</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
	<style>
		body,.page-wrap {
			width: 100%;
            height: 100%;
			margin: 0;
			padding: 0;
		}
		.page-wrap .device-info .header{
			width: 100%;
			height: 45px;
			font-size: 18px;
			font-weight: 400;
			background-color: rgb(49, 63, 86);
			color: rgba(255, 255, 255, 1);
			display: flex;
			align-items: center;
			justify-content: center;
		}
        .item-list {
            padding: 10px 30px 0 20px;
        }
        .item-list  .list {
            display: flex;
            font-size: 14px;
            font-weight: 400;
            color: rgba(0, 0, 0, 1);
            line-height: 26px;
        }
        .item-list  .list .label {
             width: 70px;
             flex-shrink: 0;
             margin-right: 15px;
         }
        .tips {
            padding: 0 20px;
            font-size: 14px;
            margin: 15px 0;
        }
        .device-info .foot {
            background-color: rgb(239, 239, 244);
            text-align: center;
            font-size: 12px;
            font-weight: 400;
            color: rgba(0, 0, 0, 1);
            line-height: 20px;
            padding: 12px 0 12px 0;
        }
		.device-info .foot a {
			color: #000;
			text-decoration: none;
        }
        .page-wrap{
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
	<div class="draw-page">
		<iframe id="machineFrame" src="machine.html" frameBorder=0 marginwidth=0 marginheight=0 scrolling="no" width="100%" height="400" style="border:0; display:block;"></iframe>
	</div>
	<div class="device-info">
		<div class="header">场地与设备信息</div>
        <div class="item-list">
            <div class="list">
                <div class="label">所在场地:</div>																									
                <div>上海角艺游科技有限公司</div>
            </div>
			<div class="list">
                <div class="label">设备编号:</div>
                <div>3739851</div>
            </div>
            <div class="list">
                <div class="label">销售厂家:</div>
                <div>畅凯动漫科技</div>
            </div>
            
        </div>
	    <img src='biaoshi.jpg' width='100%'>       <img src='authorization.jpg' width='100%'> <div class="foot">
            <div class="foot-item">

			</div>			
        </div>
    
	</div>
</div>




</body>

<script>
    window.pageConfig = {
        active : '1',
        officialQrContentUrl : ""
    }

    pageConfig.active == 0 ? location.href = pageConfig.officialQrContentUrl :  document.querySelector('.page-wrap').style.display = 'block';


    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'machineHeight') {
            var frame = document.getElementById('machineFrame');
            if (frame && e.data.height) {
                frame.style.height = e.data.height + 'px';
            }
        }
    });
</script>
</html>
