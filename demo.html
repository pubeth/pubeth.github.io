<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>3D STL 演示 — Pubeth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      body {
        overflow: hidden;
      }
      .demo-back {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 10;
      }
    </style>
    <script
      src="https://unpkg.com/three@0.146.0/build/three.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://unpkg.com/three@0.146.0/examples/js/loaders/STLLoader.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://unpkg.com/three@0.146.0/examples/js/controls/OrbitControls.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <a class="btn btn-ghost demo-back" href="index.html">← 返回主页</a>
    <script>
      const scene = new THREE.Scene();

      const light = new THREE.SpotLight();
      light.position.set(20, 20, 20);
      scene.add(light);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.z = 3;

      const renderer = new THREE.WebGLRenderer();
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const envTexture = new THREE.CubeTextureLoader().load([
        "model/px.png",
        "model/nx.png",
        "model/py.png",
        "model/ny.png",
        "model/pz.png",
        "model/nz.png",
      ]);
      envTexture.mapping = THREE.CubeReflectionMapping;
      scene.background = envTexture;

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xb2ffc8,
        envMap: envTexture,
        metalness: 0.25,
        roughness: 0.4,
        opacity: 1.0,
        transparent: true,
        transmission: 0.99,
        clearcoat: 1.0,
        clearcoatRoughness: 0.25,
      });

      const loader = new THREE.STLLoader();
      loader.load("model/guitar.stl", function (geometry) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.scale.set(0.1, 0.1, 0.1);
        scene.add(mesh);
      });

      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        const timer = Date.now() * 0.0005;
        camera.position.x = Math.cos(timer) * 4;
        camera.position.z = Math.sin(timer) * 4;
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
